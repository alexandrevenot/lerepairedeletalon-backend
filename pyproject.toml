[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lrde-backend"
version = "0.0.8"
requires-python = ">=3.11"
dependencies = [
    "google-resumable-media>=2.7.0",
    "googleapis-common-protos>=1.63.0",
    "h11>=0.14.0",
    "idna>=3.6",
    "multidict>=6.0.4",
    "numpy>=1.26.1",
    "pandas>=2.1.2",
    "passlib>=1.7.4",
    "Pillow>=10.1.0",
    "protobuf>=4.25.3",
    "pyasn1>=0.5.0",
    "pyasn1-modules>=0.3.0",
    "pydantic>=2.3.0",
    "pydantic_core>=2.6.3",
    "pymongo>=4.5.0",
    "python-dateutil>=2.8.2",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.6",
    "pytz>=2023.3.post1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "rsa>=4.9",
    "six>=1.16.0",
    "sniffio>=1.3.1",
    "soupsieve>=2.5",
    "starlette>=0.27.0",
    "stripe>=8.7.0",
    "typing_extensions>=4.8.0",
    "tzdata>=2023.3",
    "urllib3>=2.2.1",
    "yarl>=1.9.4",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "aiohttp>=3.13.3",
    "pydantic-settings>=2.13.1",
    "google-cloud-storage>=3.9.0",
]

[dependency-groups]
dev = [
    "mongomock>=4.1.2",
    "httpx>=0.25.0",
    "aioresponses>=0.7.6",
    "freezegun>=1.3.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"